# Builds the plugin and publishes a GitHub Release with the three artifacts
# Obsidian needs (main.js, manifest.json, styles.css) whenever a version tag is
# pushed. Tag with the bare version, e.g. `git tag 0.1.0 && git push origin 0.1.0`.
name: Release

on:
  push:
    tags:
      # Bare (`0.1.0`) is the only valid form — Obsidian resolves a release by
      # a tag identical to the manifest version. A v-prefixed tag is still
      # matched here on purpose, so it fails loudly in the check below rather
      # than publishing nothing at all.
      - "*.*.*"
      - "v*.*.*"

# Least privilege: only the permission needed to create a release. Uses the
# built-in GITHUB_TOKEN and the runner's `gh` CLI — no third-party actions in
# the publish step, so no external action can read the token.
permissions:
  contents: write
  # Build provenance: `id-token` mints the signing token and `attestations`
  # records the statement. Both are scoped to this workflow run.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # Gate the release on a green typecheck, lint, test suite, and build.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Verify the tag matches manifest.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The tag must be the BARE version. Obsidian resolves a plugin's
          # download from a release tagged identically to the version in
          # manifest.json (`releases/download/0.9.9/main.js`), so a `v` prefix
          # publishes a release the plugin browser cannot reach — which is
          # exactly what happened to every 0.9.x release until 0.9.9. This
          # check used to strip the prefix and let it through; the repo's
          # `.npmrc` now stops `npm version` producing one, and this refuses it
          # if it ever comes back.
          VERSION="$TAG"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "Tag '$TAG' does not match manifest version '$MANIFEST_VERSION'." >&2
            case "$TAG" in
              v*) echo "Tags must be bare (e.g. '$MANIFEST_VERSION', not '$TAG') or Obsidian cannot resolve the release." >&2 ;;
              *)  echo "Run 'npm version $VERSION' to sync manifest + versions.json, then push the tag." >&2 ;;
            esac
            exit 1
          fi
          # versions.json is what Obsidian reads to decide which build an older
          # app version may install. version-bump.mjs writes both files, so a
          # missing entry means the manifest was edited by hand — and the
          # release would publish while older clients are never offered it.
          VERSIONS_ENTRY="$(node -p "require('./versions.json')['$VERSION'] || ''")"
          if [ -z "$VERSIONS_ENTRY" ]; then
            echo "versions.json has no entry for '$VERSION'." >&2
            echo "Run 'npm version $VERSION' rather than editing manifest.json by hand." >&2
            exit 1
          fi
          MIN_APP="$(node -p "require('./manifest.json').minAppVersion")"
          if [ "$VERSIONS_ENTRY" != "$MIN_APP" ]; then
            echo "versions.json maps '$VERSION' to minAppVersion '$VERSIONS_ENTRY', but manifest.json says '$MIN_APP'." >&2
            exit 1
          fi

      # Signed provenance for exactly the bytes published below, so anyone can
      # verify a downloaded main.js was built by this workflow from this tag
      # (`gh attestation verify main.js --repo <owner>/<repo>`). This is the one
      # first-party action trusted with the run's OIDC token; the publish step
      # below still uses only `gh`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # SHA256SUMS lets installers (scripts/install.sh) verify the assets.
          sha256sum main.js manifest.json styles.css > SHA256SUMS
          gh release create "$TAG" \
            --title "${TAG#v}" \
            --notes "Coder Engram ${TAG#v}. See CHANGELOG.md for details." \
            main.js manifest.json styles.css SHA256SUMS
