# Typecheck, lint, test, and build on every push to a main branch and every PR.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Read-only: CI never needs to write to the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
